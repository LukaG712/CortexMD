services:
  cortexmd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortexmd
    restart: unless-stopped
    ports:
      - "${CORTEX_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - CORTEX_DATA_DIR=/data
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-cortex-admin-change-me}
      - APP_SECRET=${APP_SECRET:-change-this-secret-to-a-random-32-plus-character-string}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - COPILOT_GITHUB_TOKEN=${COPILOT_GITHUB_TOKEN:-}
      - JUNIE_API_KEY=${JUNIE_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    volumes:
      # Bind persistent vault & SQLite storage outside the container on SSD
      - ${CORTEX_HOST_DATA_PATH:-./data}:/data
      # Optional mount for HDD backup destination
      - ${CORTEX_HOST_BACKUP_PATH:-./backups}:/data/backups
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 128M
    extra_hosts:
      - "host.docker.internal:host-gateway"
