<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27272a" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.25" stroke="#27272a"/>

  <!-- Geometric Cortex Node Icon -->
  <g transform="translate(556, 46)">
    <rect x="0" y="0" width="88" height="88" rx="22" fill="#111827" stroke="url(#accent)" stroke-width="1.5"/>
    <circle cx="44" cy="24" r="5" fill="#34d399"/>
    <circle cx="24" cy="56" r="5" fill="#38bdf8"/>
    <circle cx="64" cy="56" r="5" fill="#38bdf8"/>
    <circle cx="44" cy="46" r="4" fill="#e4e4e7"/>
    <path d="M44 24 L24 56 L64 56 Z" stroke="url(#accent)" stroke-width="1.8" stroke-linejoin="round" fill="none" opacity="0.85"/>
    <path d="M44 24 L44 46 M24 56 L44 46 M64 56 L44 46" stroke="#a1a1aa" stroke-width="1.4" opacity="0.75"/>
  </g>

  <!-- Title -->
  <text x="600" y="186" text-anchor="middle" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    CortexMD
  </text>

  <!-- Tagline -->
  <text x="600" y="226" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">
    Self-hosted, Markdown-first, AI-native personal knowledge platform.
  </text>

  <!-- Pill Tags -->
  <g transform="translate(278, 252)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="142" height="28" rx="14" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.35"/>
    <text x="71" y="18" text-anchor="middle" fill="#34d399">Plain .md Vaults</text>

    <rect x="156" y="0" width="160" height="28" rx="14" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="236" y="18" text-anchor="middle" fill="#38bdf8">Zero-Key Local AI</text>

    <rect x="330" y="0" width="148" height="28" rx="14" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.35"/>
    <text x="404" y="18" text-anchor="middle" fill="#c084fc">SQLite FTS5 + RAG</text>

    <rect x="492" y="0" width="152" height="28" rx="14" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="568" y="18" text-anchor="middle" fill="#fbbf24">Desktop + Docker</text>
  </g>
</svg>
